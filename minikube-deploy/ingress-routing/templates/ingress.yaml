apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-booking-system-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: ticket-booking-system.local
    http:
      paths:
      - path: /simple-concert-service
        pathType: Prefix
        backend:
          service:
            name: simple-concert-service-microservice-generic
            port:
              number: 80
      - path: /simple-cinema-service
        pathType: Prefix
        backend:
          service:
            name: simple-cinema-service-microservice-generic
            port:
              number: 80
      - path: /identity-provider
        pathType: Prefix
        backend:
          service:
            name: identity-provider-microservice-generic
            port:
              number: 80