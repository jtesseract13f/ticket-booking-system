apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservice-generic.fullname" . }}
  labels:
    {{- include "microservice-generic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | default 80 }}
      protocol: TCP
      name: http
  selector:
    {{- include "microservice-generic.selectorLabels" . | nindent 4 }}